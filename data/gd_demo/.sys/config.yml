# Database settings

thisFile: '-this'         # content file of a folder, written by the app
thisFileMatch: ''         # regex on the name without .md, also read as content file, e.g. '-\s*DESC.*'
linkMarker: ' (lnk)'
defaultType: 'Info'
pageSize: 8
sort:
  by: 'created'
  dir: 'desc'

# Fields carried in file and folder names, applied in this order; what is left is the title.
# A token stands alone in the name (blank or name start/end around it), group 1 of match is the value.
#
# nameFields:
#   - field: 'target2'
#     match: '\(?lnk-([^\s()]+)\)?'      # "My file (lnk-K12)" is a link to the entry with id2 K12
#     format: '(lnk-{value})'
#     role: 'link'
#   - field: 'id2'
#     match: '\(?(?:id-|#)([^\s()]+)\)?' # "(id-K12)", "id-K12" or "#K12"
#     format: '(id-{value})'             # no format: read-only
#     role: 'id'                         # alternative unique id
#   - field: 'tags'
#     values: ['best', 'draft']          # only these strings are tags, "(some text)" stays in the title
#     format: '({value})'                # how a tag is written, and found; or match: '\(?{value}\)?'
#     list: true                         # a type may add tags: "nameFields: { tags: ['urgent'] }" in types/MY_TYPE.yml
nameFields:
  - field: 'prio'                      # "2 - My task": selection or priority, makes the entry an Activity
    label: 'Prio'
    values: ['1', '2', '3', '4', '5']  # lists are sorted in this order
    labels: { '1': 'Selected', '2': 'Selected here', '3': 'High', '4': 'Medium', '5': 'Low' }
    match: '{value}\s*-\s*'           # "2 - x", "2-x", "2 -x", "2- x"
    format: '{value} - '
    at: 'start'
    type: 'Activity'
    sort: true
    selected: { '1': 'global', '2': 'local' }
  - field: 'tags'
    values: ['best']
    format: '({value})'
    list: true
