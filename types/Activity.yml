# Activity: a step in a process

name: 'Activity'
label: 'Activity'
description: 'A step in a process, may contain further steps'
idPattern: '{slug}-{YYYY}-{MM}-{DD}-{HHmm}'
icon: 'activity'

# Viewer shown unless the user picked another one: type_viewer/Activity/NAME
viewer: 'default'

fields:
  title:
    type: 'text'
    required: true
  status:
    type: 'select'
    options: ['open', 'running', 'done']
  body:
    type: 'markdown'
    label: 'Description'
  schedule:
    label: 'Schedule'
    tab: 'schedule'
    fields:
      start:
        type: 'date'
      end:
        type: 'date'

# Fixed values this type adds to the name fields of a database, here to its tags.
# The database's .sys/config.yml defines the field and how it is written.
nameFields:
  tags: ['urgent']

# Tabs of the navigation column: each one filters the children
tabs:
  entries:
    label: 'Entries'
    types: ['Activity', 'Info', 'Group']
    include: ['inline', 'link']
    tools: true
  participants:
    label: 'Participants'
    types: ['Person']
    include: ['link', 'inline']
  resources:
    label: 'Resources'
    types: ['File']
    include: ['inline']

create:
  entries: ['Activity', 'Info']
  participants: ['__link:Person']
  resources: []
