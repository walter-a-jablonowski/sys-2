# Info: a plain text entry

name: 'Info'
label: 'Info'
description: 'A text entry with a headline and a description'
idPattern: '{slug}-{YYYY}-{MM}-{DD}-{HHmm}'
icon: 'info'

# Viewer shown unless the user picked another one: type_viewer/Info/NAME
viewer: 'default'

fields:
  title:
    type: 'text'
    required: true
  body:
    type: 'markdown'
    label: 'Description'

tabs:
  entries:
    label: 'Entries'
    include: ['inline', 'link']
    tools: true
  resources:
    label: 'Resources'
    types: ['File']
    include: ['inline']

create:
  entries: ['Info', 'Activity']
  resources: []
