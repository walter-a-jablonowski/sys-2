# Person: someone taking part

name: 'Person'
label: 'Person'
description: 'A participant, usually linked into an activity'
idPattern: '{slug}-{YYYY}-{MM}-{DD}-{HHmm}'
icon: 'person'

# Viewer shown unless the user picked another one: type_viewer/Person/NAME
viewer: 'default'

fields:
  title:
    type: 'text'
    label: 'Name'
    required: true
  role:
    type: 'text'
  email:
    type: 'email'
  phone:
    type: 'tel'
  body:
    type: 'markdown'
    label: 'Notes'

tabs:
  resources:
    label: 'Resources'
    types: ['File']
    include: ['inline']

create:
  resources: []
